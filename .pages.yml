# Generated by scripts/generate-cms.mjs. GitHub credentials are managed by Pages CMS.
media:
  - name: featured_images
    label: تصاویر برگزیده‌ها
    input: public/media/featured
    output: /media/featured
    rename: random
    extensions:
      - png
      - jpg
      - jpeg
      - webp
      - avif
      - gif
  - name: project_images
    label: تصویر پروژه‌ها
    input: public/media/projects
    output: /media/projects
    rename: random
    extensions:
      - png
      - jpg
      - jpeg
      - webp
      - avif
      - gif
  - name: certificate_images
    label: تصویر مدارک
    input: public/media/certificates
    output: /media/certificates
    rename: random
    extensions:
      - png
      - jpg
      - jpeg
      - webp
      - avif
      - gif
  - name: certificate_pdfs
    label: فایل PDF مدارک
    input: public/media/certificates
    output: /media/certificates
    rename: random
    extensions:
      - pdf
  - name: article_images
    label: تصویر مقاله‌ها
    input: public/media/articles
    output: /media/articles
    rename: random
    extensions:
      - png
      - jpg
      - jpeg
      - webp
      - avif
      - gif
content:
  - name: featured
    label: برگزیده‌ها
    type: collection
    path: src/content/featured
    format: json
    subfolders: false
    filename:
      template: "{fields.slug}.json"
      field: false
    operations:
      create: true
      delete: true
      rename: false
    view:
      primary: title
      fields:
        - title
        - order
      sort:
        - order
        - title
      search:
        - title
        - slug
      default:
        sort: order
        order: asc
    fields:
      - &a1
        name: slug
        label: شناسهٔ آدرس
        type: string
        required: true
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        description: "انگلیسی و خط تیره؛ پس از انتشار تغییر نده. نمونه: my-project"
      - &a2
        name: order
        label: ترتیب نمایش
        type: number
        required: true
        default: 10
        options:
          min: 0
        description: عدد صحیح؛ عدد کمتر بالاتر نمایش داده می‌شود.
      - name: title
        label: عنوان کارت
        type: string
        required: true
      - name: summary
        label: توضیح کارت
        type: text
        required: true
      - name: url
        label: نشانی مقصد
        type: string
        required: true
        pattern: ^(https?://|/(?!/))
        description: صفحهٔ پروژه، مقاله، فایل مدرک یا یک نشانی بیرونی.
      - name: image
        label: تصویر کارت
        type: image
        options:
          media: featured_images
          rename: random
          extensions:
            - png
            - jpg
            - jpeg
            - webp
            - avif
            - gif
      - name: emoji
        label: نماد جایگزین
        type: string
        default: ⭐
      - name: published
        label: نمایش در سایت
        type: boolean
        default: true
      - name: translations
        label: ترجمه‌های اختیاری
        type: object
        fields:
          - name: fa
            label: فارسی
            type: object
            fields:
              - name: title
                label: عنوان
                type: string
                required: true
              - name: summary
                label: توضیح
                type: text
                required: true
          - name: de
            label: آلمانی
            type: object
            fields:
              - name: title
                label: عنوان
                type: string
                required: true
              - name: summary
                label: توضیح
                type: text
                required: true
  - name: projects
    label: پروژه‌ها
    type: collection
    path: src/content/projects
    format: json
    subfolders: false
    filename:
      template: "{fields.slug}.json"
      field: false
    operations:
      create: true
      delete: true
      rename: false
    view:
      primary: title
      fields:
        - title
        - order
      sort:
        - order
        - title
      search:
        - title
        - slug
      default:
        sort: order
        order: asc
    fields:
      - *a1
      - *a2
      - name: title
        label: نام پروژه
        type: string
        required: true
      - name: summary
        label: شرح پروژه
        type: text
        required: true
      - name: tags
        label: فناوری‌ها
        type: string
        required: true
        list:
          min: 1
          collapsible: false
      - name: status
        label: وضعیت
        type: select
        required: true
        default: Planned
        options:
          values:
            - name: Live
              label: منتشرشده
            - name: In Progress
              label: در حال انجام
            - name: Building
              label: در حال ساخت
            - name: Planned
              label: برنامه‌ریزی‌شده
      - &a3
        name: links
        label: پیوندها
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: متن دکمه
            type: string
            required: true
          - name: url
            label: نشانی کامل
            type: string
            required: true
            pattern: ^https?://[^\s]+$
          - name: primary
            label: پیوند اصلی
            type: boolean
            default: false
      - name: documentation
        label: مستندات
        type: text
        description: متن ساده؛ بین پاراگراف‌ها یک خط خالی بگذار.
      - name: emoji
        label: نماد پروژه
        type: string
        required: true
        default: 🌐
      - name: colorA
        label: رنگ اول
        type: string
        hidden: true
        default: "#DDB967"
      - name: colorB
        label: رنگ دوم
        type: string
        hidden: true
        default: "#B08940"
      - name: thumbnail
        label: تصویر پروژه
        type: image
        options:
          media: project_images
          rename: random
          extensions:
            - png
            - jpg
            - jpeg
            - webp
            - avif
            - gif
      - name: liveUrl
        label: نشانی نمایش زنده
        type: string
        pattern:
          regex: ^https?://[^\s]+$
          message: نشانی کامل با https:// وارد کن؛ یا فیلد را خالی بگذار.
      - name: githubUrl
        label: نشانی گیت‌هاب
        type: string
        pattern:
          regex: ^https?://[^\s]+$
          message: نشانی کامل با https:// وارد کن؛ یا فیلد را خالی بگذار.
      - name: translations
        label: ترجمه‌ها
        type: object
        required: true
        fields:
          - name: fa
            label: فارسی
            type: object
            required: true
            fields:
              - &a4
                name: title
                label: نام پروژه
                type: string
                required: true
              - &a5
                name: summary
                label: شرح پروژه
                type: text
                required: true
              - &a6
                name: tags
                label: فناوری‌ها
                type: string
                required: true
                list:
                  min: 1
                  collapsible: false
              - &a7
                name: status
                label: وضعیت به زبان همین بخش
                type: string
                required: true
              - *a3
              - &a8
                name: documentation
                label: مستندات
                type: text
                description: متن ساده؛ بین پاراگراف‌ها یک خط خالی بگذار.
              - name: seoTitle
                label: نام کاملاً فارسی برای جست‌وجو
                type: string
                required: true
                pattern:
                  regex: ^[^A-Za-z]+$
                  message: در این فیلد فقط نام فارسی بنویس.
          - name: de
            label: آلمانی
            type: object
            required: true
            fields:
              - *a4
              - *a5
              - *a6
              - *a7
              - *a3
              - *a8
  - name: certificates
    label: مدارک
    type: collection
    path: src/content/certificates
    format: json
    subfolders: false
    filename:
      template: "{fields.slug}.json"
      field: false
    operations:
      create: true
      delete: true
      rename: false
    view:
      primary: name
      fields:
        - name
        - order
      sort:
        - order
        - name
      search:
        - name
        - slug
      default:
        sort: order
        order: asc
    fields:
      - *a1
      - *a2
      - &a9
        name: name
        label: عنوان مدرک
        type: string
        required: true
      - &a10
        name: issuer
        label: صادرکننده
        type: string
        required: true
      - name: date
        label: تاریخ نمایشی
        type: string
        required: true
        pattern: ^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) \d{4}$
        description: "مثال: Oct 2026؛ تاریخ ترجمه‌ها آزاد است."
      - &a11
        name: description
        label: شرح
        type: text
        required: true
      - name: category
        label: گروه
        type: select
        required: true
        options:
          values:
            - name: python
              label: پایتون
            - name: web
              label: وب
            - name: linux
              label: لینوکس
            - name: goethe
              label: آلمانی
      - name: emoji
        label: نماد مدرک
        type: string
        required: true
        default: 🎓
      - name: image
        label: تصویر مدرک
        type: image
        options:
          media: certificate_images
          rename: random
          extensions:
            - png
            - jpg
            - jpeg
            - webp
            - avif
            - gif
      - name: pdf
        label: فایل PDF
        type: file
        options:
          media: certificate_pdfs
          extensions:
            - pdf
          rename: random
      - name: credentialUrl
        label: پیوند رسمی اعتبارسنجی
        type: string
        pattern:
          regex: ^https?://[^\s]+$
          message: نشانی کامل با https:// وارد کن؛ یا فیلد را خالی بگذار.
      - name: translations
        label: ترجمه‌ها
        type: object
        required: true
        fields:
          - name: fa
            label: فارسی
            type: object
            required: true
            fields:
              - *a9
              - *a10
              - &a12
                name: date
                label: تاریخ نمایشی
                type: string
                required: true
              - *a11
          - name: de
            label: آلمانی
            type: object
            required: true
            fields:
              - *a9
              - *a10
              - *a12
              - *a11
  - name: articles
    label: مقاله‌ها
    type: collection
    path: src/content/articles
    format: json
    subfolders: false
    filename:
      template: "{fields.slug}.json"
      field: false
    operations:
      create: true
      delete: true
      rename: false
    view:
      primary: title
      fields:
        - title
        - order
      sort:
        - order
        - title
      search:
        - title
        - slug
      default:
        sort: order
        order: asc
    fields:
      - *a1
      - *a2
      - name: draft
        label: پیش‌نویس؛ هنوز منتشر نشود
        type: boolean
        default: true
      - name: language
        label: زبان اصلی مقاله
        type: string
        required: true
        default: en
        pattern: ^[a-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$
        description: "کد زبان: fa، en، de، ar، tr و …؛ متن با زبان سایت تغییر نمی‌کند."
      - name: title
        label: عنوان مقاله
        type: string
        required: true
      - name: summary
        label: خلاصه
        type: text
        required: true
      - name: categories
        label: دسته‌ها
        type: string
        required: true
        list:
          min: 1
          collapsible: false
      - name: date
        label: تاریخ نمایشی
        type: string
        required: true
      - name: body
        label: متن مقاله
        type: rich-text
        required: true
        options:
          format: html
          media: article_images
          rename: random
          switcher: true
        description: از ویرایشگر بصری استفاده کن. برای بخش‌ها عنوان سطح ۳ انتخاب کن.
      - name: readingTimeMode
        label: زمان مطالعه
        type: select
        default: auto
        options:
          values:
            - name: auto
              label: خودکار
            - name: manual
              label: دستی
      - name: readTime
        label: زمان مطالعهٔ دستی
        type: string
      - name: toc
        label: فهرست مطالب خودکار
        type: boolean
        default: true
      - name: seoTitle
        label: عنوان سئو
        type: string
      - name: seoDescription
        label: توضیح نتیجهٔ جست‌وجو
        type: text
      - name: focusKeyword
        label: عبارت کلیدی هدف
        type: string
        description: عبارت اصلی مقاله؛ گزارش بررسی پس از ذخیره در GitHub Actions ساخته
          می‌شود. تکرار مصنوعی کلمات لازم نیست.
      - name: updatedAt
        label: آخرین ویرایش
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: publishedAt
        label: روز دقیق انتشار
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
        description: اگر روز دقیق را نمی‌دانی خالی بگذار.
      - name: cover
        label: تصویر روی جلد
        type: image
        options:
          media: article_images
          rename: random
          extensions:
            - png
            - jpg
            - jpeg
            - webp
            - avif
            - gif
      - name: coverAlt
        label: توضیح تصویر روی جلد
        type: string
settings:
  content:
    merge: true
