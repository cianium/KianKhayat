name: Studio CI
on:
  push:
    paths:
      - 'studio/**'
      - 'src/**'
      - 'public/**'
      - '.github/workflows/studio-ci.yml'
  pull_request:
    paths:
      - 'studio/**'
      - 'src/**'
      - 'public/**'
      - '.github/workflows/studio-ci.yml'
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node --test studio/*.test.mjs
      - run: cp studio/.env.example studio/.env && docker compose -f studio/compose.yaml config --quiet
      - run: docker build -t studio-ci studio
