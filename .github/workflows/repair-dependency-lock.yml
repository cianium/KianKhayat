name: One-time dependency lockfile repair

on:
  push:
    branches:
      - fix/portfolio-ci-deps-and-playwright-20261026
    paths:
      - .github/workflows/repair-dependency-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-lockfile:
    if: github.ref == 'refs/heads/fix/portfolio-ci-deps-and-playwright-20261026'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Resolve patched direct dependency into lockfile
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Apply compatible security updates to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Verify no high severity vulnerabilities
        run: npm audit --audit-level=high
      - name: Commit security fixes on this feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
            exit 0
          fi
          git commit -m "security: update resolved dependencies in lockfile"
          git push origin "HEAD:refs/heads/fix/portfolio-ci-deps-and-playwright-20261026"
