services:
  studio:
    build:
      context: ..
      dockerfile: studio/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8085:8080"
    volumes:
      - studio-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:8080/healthz',{headers:{host:'manage.kiankhayat.me'}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  studio-data:
